# Overlay for production: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# The SQLite file lives on the track_data volume — make sure that volume is on
# durable, backed-up storage in production (a single named volume is fine for
# one host; move to a shared/managed DB if the backend ever needs to scale
# beyond one replica).

services:
  frontend:
    restart: always
    ports: ["80:80"]

  backend:
    restart: always
    environment:
      - INFERENCE_URL=http://inference:8500
      - DB_PATH=/data/track.db
      - READOUT_WINDOW_S=900
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  inference:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
