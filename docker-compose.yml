services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports: ["3000:80"]
    depends_on: [backend]

  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      - INFERENCE_URL=http://inference:8500
      - DB_PATH=/data/track.db
      - READOUT_WINDOW_S=900
    volumes:
      - track_data:/data
    depends_on: [inference]

  inference:
    build: ./inference
    environment:
      # onnx = real trained model in inference/model/ (default now that one exists)
      # stub = brightness/saturation heuristic, no model file needed
      - MODEL_BACKEND=${MODEL_BACKEND:-onnx}
    ports: ["8500:8500"]

volumes:
  track_data:
